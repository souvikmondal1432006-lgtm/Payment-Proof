server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: payment-proof-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:standalone}
  
# Database configuration is profile-driven:
# - standalone profile -> application-standalone.yml (in-memory H2)
# - mysql profile -> application-mysql.yml (strict environment variables DB_URL, DB_USER, DB_PASSWORD)

# External Services Integration
app:
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    timeout-ms: 4000
    base-url: https://generativelanguage.googleapis.com/v1beta
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

logging:
  level:
    root: INFO
    com.paymentproof: DEBUG
    org.springframework.web: INFO
