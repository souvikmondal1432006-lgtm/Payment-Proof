server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: payment-proof-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:standalone}
  
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/payment_proof?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:payment_user}
    password: ${DB_PASSWORD:payment_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# External Services Integration
app:
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"

logging:
  level:
    root: INFO
    com.paymentproof: DEBUG
    org.springframework.web: INFO
