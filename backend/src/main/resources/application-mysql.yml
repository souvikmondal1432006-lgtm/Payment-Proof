spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: ${DB_URL:${DATABASE_URL:${SPRING_DATASOURCE_URL:}}}
    username: ${DB_USER:${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}}
    password: ${DB_PASSWORD:${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: PaymentProofMySQLPool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: ${DB_INIT_MODE:never}
